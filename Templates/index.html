<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Gestionnaire de Tâches</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <section class="form-section">
        <h2>Nouvelle Tâche</h2>
        <form action="/ajouter" method="POST" class="add-form">
            <input type="text" name="titre" placeholder="Titre (Obligatoire)" required>
            <input type="text" name="description" placeholder="Description">
            <input type="date" name="date_fin">
            <select name="colonne_id">
                {% for col in colonnes %}
                <option value="{{ col.id }}">{{ col.titre }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn-valider">Ajouter</button>
        </form>
    </section>

    <div class="kanban-board">
        {% for col in colonnes %}
        <div class="kanban-column">
            <div class="column-header">
                <h3>{{ col.titre }}</h3>
                <button onclick="editColumnTitle({{ col.id }}, '{{ col.titre }}')">✏️</button>
            </div>
            <div class="task-list" id="col-{{ col.id }}">
                {% for tache in taches if tache.colonne_id == col.id %}
                <div class="task-card {{ 'is-done' if tache.fait }}" data-id="{{ tache.id }}">
                    <div class="drag-handle" style="cursor:grab; color:#ccc;">⠿</div>
                    <div class="task-content">
                        <strong>{{ tache.titre }}</strong> <p>{{ tache.description }}</p> <small>Fin: {{ tache.date_fin }}</small> </div>
                    <a href="/toggle_tache/{{ tache.id }}" class="status-btn">
                        {{ '✅ Terminé' if tache.fait else '⏳ À faire' }} </a>
                    <div class="task-actions" style="display:flex; justify-content: space-between; margin-top:10px;">
                        <button onclick="openEditModal({{ tache.id }}, '{{ tache.titre }}', '{{ tache.description }}')" class="btn-mod">⚙️ Modifier</button>
                        <form action="/supprimer/{{ tache.id }}" method="POST">
                            <button type="submit" class="btn-sup">🗑️</button> </form>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>Modifier la tâche</h3> <form id="editTaskForm" method="POST">
                <input type="text" name="titre" id="editTitre" required style="width:100%; margin-bottom:10px;">
                <textarea name="description" id="editDesc" style="width:100%; height:100px; margin-bottom:10px;"></textarea>
                <div style="display:flex; gap:10px;">
                    <button type="submit" class="btn-valider">Enregistrer</button>
                    <button type="button" onclick="closeModal()" style="background:#ccc;">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
